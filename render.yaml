databases:
  - name: reputeai-db
    plan: free
    databaseName: reputeai
    user: reputeai

services:
  - type: web
    name: reputeai
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reputeai-db
          property: connectionString
      - key: CLIENT_URL
        value: https://reputeai-c7v3.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://reputeai-c7v3.onrender.com/api/google/callback
      - key: NODE_VERSION
        value: "20"
